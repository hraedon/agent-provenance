[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn"
version = "0.1.0"
description = "Cryptographic provenance for agentic workflows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Project Owner"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # The [encryption] extra is not optional here: cairn declares content
    # encryption ON by default, so a default install that cannot import the
    # cipher captures nothing (fail-closed, WI-037) while doctor used to say
    # ok — observed on this estate the day WI-037 shipped (WI-040).
    # 0.7.1 ships the public offline verification surface
    # (regista.verification) that cairn's verifier imports at runtime.
    "regista-hraedon[encryption]>=0.7.1,<0.8",
    "rfc8785>=0.1.4",
    "structlog>=24.1",
    "click>=8.1",
]

[tool.uv.sources]
# regista-hraedon is published on PyPI (distribution renamed from `regista`;
# the import name is still `regista`). This editable mapping overrides the
# published wheel with the local sibling checkout so `uv lock` / `uv run`
# resolve against the working tree during development.
regista-hraedon = { path = "../regista", editable = true }

[project.optional-dependencies]
# A ``vault:`` secret ref resolves only where ``hvac`` is importable in the
# resolving component's OWN environment — each suite CLI is its own uv tool
# venv, so hvac in regista's does nothing for cairn's. Without this, a host
# whose DSN or content key is a vault ref fails with "Unknown secret provider"
# (observed on the qualification host for both). ``cairn doctor`` names this
# extra as the remedy, so it has to exist.
vault = [
    "regista-hraedon[vault]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16,<1",
    "mypy>=1.10",
    "asn1crypto>=1.5",
    "pynacl>=1.5",
    "cryptography>=42.0",
    # CLI contract v1 conformance kit (Plan 018 WI-2 / Plan 019 B1 / WI-023).
    # v1.1.0 ships the WI-026 meta-guard helpers (assert_cases_declared +
    # ConformanceGateError), so the conformance tests consume them directly from
    # the kit instead of carrying local copies. The kit requires py>=3.12; cairn's
    # *runtime* still supports 3.11, so the dep is conditional and the conformance
    # gate runs on the 3.12+ CI lane. Consumed only by the conformance tests,
    # never imported by runtime code.
    "agent-suite-conformance==1.1.0; python_version >= '3.12'",
]

[project.scripts]
cairn = "cairn._cli:cli_entry"
cairn-bridge = "cairn._bridge:main"
# Harness hook entry points (WI-033). Generated hook config and the shipped
# Codex plugin both invoke these names rather than ``python3 -m cairn._*_hook``:
# a console script's shebang pins cairn's own interpreter, so hook execution can
# never resolve to a foreign python that cannot import cairn (which silently
# disabled every hook on a real deployment), and the string is stable at
# packaging time, so the shipped plugin and the generated entries are identical.
cairn-claude-hook = "cairn._claude_hook:main"
cairn-codex-hook = "cairn._codex_hook:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.hatch.build.targets.wheel.force-include]
# ``integrations/`` ships because installed cairn READS it: ``install-harness
# opencode`` registers ``cairn/integrations/opencode/index.js`` by path, so a
# wheel without it wires a plugin that is not there (hence the wheel test).
"integrations" = "cairn/integrations"

# ``plugins/cairn/`` is deliberately NOT shipped (WI-038).  It is the Codex
# *marketplace* form of this component, and its only consumer —
# ``agent-suite codex-plugins build-marketplace`` — resolves it from the
# workspace checkout and symlinks that directory into the generated marketplace.
# Nothing in installed cairn reads it: ``install-harness --target codex`` writes
# ``~/.codex/hooks.json`` from ``_install._expected_hook_entry`` in code, so an
# installed cairn can already wire Codex without the bundle.  Shipping it would
# add a second copy of a manifest that must stay byte-identical to the entries
# the installer generates (``test_plugin_hooks_match_direct_installer_canonical_entries``)
# while being loaded from a path Codex never looks at — a drift surface with no
# consumer.  If an installed cairn ever needs to materialise its own Codex
# plugin, force-include it HERE and extend
# ``test_wheel_ships_integrations_but_not_the_codex_plugin_bundle``; do not
# assume from the repo layout that it already ships.

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"
markers = [
    "slow: tests that build/install wheels or exercise external tools",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

# regista is a sibling repo without a py.typed marker. Ignore its missing
# stubs rather than letting them fail the CI type-check gate.
[[tool.mypy.overrides]]
module = ["regista", "regista.*"]
ignore_missing_imports = true
