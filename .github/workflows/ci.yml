name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 3.13/3.14 per the suite Python-version policy (was 3.11 — the B3 audit
        # flagged the drift). The conformance kit also requires py>=3.12.
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          # regista-hraedon is published on PyPI (renamed distribution; the
          # import name is still `regista`). Install before the editable
          # install so cairn's regista-hraedon>=0.5.1,<0.6 pin can resolve.
          # Pinned to 0.5.3 to match SUITE.lock (the B3 audit flagged the 0.5.1
          # drift). Matches the agent-notes/dossier CI pattern.
          pip install "regista-hraedon==0.5.3"
          pip install -e ".[dev]"

      # Denylist is never committed — it comes from the CAIRN_FORBIDDEN_IDENTIFIERS
      # repository secret (gpo-lens pattern). No-op until the secret is set.
      - name: Identifier gate
        env:
          CAIRN_FORBIDDEN_IDENTIFIERS: ${{ secrets.CAIRN_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Verify test collection
        run: pytest --collect-only -q

      - name: Run tests
        run: pytest --tb=short -q

  js-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Run OpenCode plugin tests
        run: bun test
        working-directory: integrations/opencode
