[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn"
version = "0.1.0"
description = "Cryptographic provenance for agentic workflows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Project Owner"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "regista>=0.5.1,<0.6",
    "rfc8785>=0.1.4",
    "structlog>=24.1",
    "click>=8.1",
]

[tool.uv.sources]
# The required Regista 0.5.1 public facade is currently available from the
# suite sibling checkout but not yet from a published index/tag. Replace this
# development override with a pinned published source once that facade lands.
regista = { path = "../regista", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "asn1crypto>=1.5",
    "pynacl>=1.5",
    "cryptography>=42.0",
]

[project.scripts]
cairn = "cairn._cli:main"
cairn-bridge = "cairn._bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.hatch.build.targets.wheel.force-include]
"integrations" = "cairn/integrations"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

# regista is a sibling repo without a py.typed marker. Ignore its missing
# stubs rather than letting them fail the CI type-check gate.
[[tool.mypy.overrides]]
module = ["regista", "regista.*"]
ignore_missing_imports = true
