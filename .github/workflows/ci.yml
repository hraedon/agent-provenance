name: CI

on:
  push:
    branches: [main]
    # Release tags run the full suite INCLUDING the built-wheel conformance lane
    # (cli-contract.md §7 designates that lane for release tags). v* matches the
    # family's v-prefixed release tags (e.g. v0.1.0); main/PR behavior is unchanged.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 3.13/3.14 per the suite Python-version policy (was 3.11 — the B3 audit
        # flagged the drift). The conformance kit also requires py>=3.12.
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (develop-against-lock, Plan 019 B2)
        run: |
          # The paved installer reads SUITE.lock [spine].version and installs
          # regista-hraedon at that locked release from PyPI (today 0.5.4),
          # then `-e .[dev]`. Same install shape as local `make dev`, so CI and
          # a developer's machine develop against the same shipped substrate.
          # No hardcoded version pin here — it would silently drift from
          # SUITE.lock (the 0.5.1-vs-0.5.3 class the B3 audit flagged).
          # tests/test_develop_against_lock.py is the mechanical control.
          python scripts/dev-install.py

      # Denylist is never committed — it comes from the CAIRN_FORBIDDEN_IDENTIFIERS
      # repository secret (gpo-lens pattern). No-op until the secret is set.
      - name: Identifier gate
        env:
          CAIRN_FORBIDDEN_IDENTIFIERS: ${{ secrets.CAIRN_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Verify test collection
        run: pytest --collect-only -q

      - name: Run tests
        run: pytest --tb=short -q

  js-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Run OpenCode plugin tests
        run: bun test
        working-directory: integrations/opencode


  # Built-wheel CLI contract conformance lane (cli-contract.md §7 / WI-023).
  #
  # Proves the *released artifact* — the cairn wheel installed into a clean venv —
  # satisfies CLI contract v1, running the conformance kit against the installed
  # `cairn` console entry point, never the editable source checkout. The
  # source-checkout lane (lint-and-test) can stay green while a packaging /
  # force-include regression silently breaks the shipped wheel; this lane catches
  # that class. It is the lane the contract designates for release tags; it also
  # runs per-PR because it is cheap (one wheel build plus a pinned PyPI install).
  #
  # The conformance tests are copied to a scratch dir and run from there with the
  # source checkout NOT on sys.path and its conftest absent, so a pass proves the
  # installed entry points + the wheel's own metadata are what is under test. The
  # whole-module-skip meta-guard (test_conformance_meta_guard.py) runs too, so an
  # all-skip / importorskip-fired outcome reddens the build instead of passing
  # silently (WI-026).
  conformance-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Build the cairn wheel
        run: |
          python -m pip install --upgrade pip build
          python -m pip wheel . --no-deps -w dist/
          ls dist/

      - name: Install wheel + pinned kit + pytest into a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          # The cairn wheel pulls its runtime deps (regista-hraedon, click, ...)
          # from PyPI; the pinned conformance kit + pytest complete the environment.
          # pytest is pinned to the repo's supported range (dev extra: pytest>=8.0;
          # <9 keeps the summary-line parsing the meta-guard relies on stable).
          /tmp/wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/wheel-venv/bin/python -m pip install dist/cairn-*.whl agent-suite-conformance==1.1.0 "pytest>=8,<9"

      - name: Stage conformance tests away from the source checkout
        run: |
          # Copy ONLY the two conformance test files (not conftest.py / fixtures),
          # preserving the tests/ layout the meta-guard's REPO_ROOT math expects.
          mkdir -p /tmp/conformance-run/tests
          cp tests/test_cli_conformance.py tests/test_conformance_meta_guard.py /tmp/conformance-run/tests/

      - name: Run conformance against the installed entry points
        working-directory: /tmp/conformance-run
        run: |
          # cwd is the scratch dir, so the source checkout is neither the rootdir
          # nor on sys.path: `import cairn` and the `cairn` console script both
          # resolve to the clean venv's site-packages (the built wheel).
          # No `-q`: the meta-guard subprocess parses pytest's summary line, and the
          # default reporter emits a stable "N passed in Xs" line (see the guard).
          /tmp/wheel-venv/bin/python -c 'import cairn, sys; assert "site-packages" in cairn.__file__, cairn.__file__; print("cairn under test:", cairn.__file__)'
          /tmp/wheel-venv/bin/python -m pytest tests/ -p no:cacheprovider --no-header --color=no


  # NOTE — deliberately no `uv lock --check` job here, unlike the rest of the
  # suite. This repo's [tool.uv.sources] maps regista-hraedon to an editable
  # ../regista sibling checkout for local development, so the committed
  # uv.lock records `editable = "../regista"` — a path that does not exist in
  # CI. `uv lock --check` therefore fails with "Distribution not found"
  # regardless of whether the lock is actually current. The lock here is a
  # developer convenience, not a reproducible CI input; CI resolves through
  # scripts/dev-install.py against the SUITE.lock-pinned version instead.
