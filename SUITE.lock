# SUITE.lock — cairn (agent-provenance) face compatibility manifest.
#
# Records the exact released version of the suite spine (regista) this release
# of cairn was tested against. A suite release is green when every component's
# SUITE.lock agrees with the umbrella agent-suite/SUITE.lock.
#
# This is the in-repo *single source of truth for what to develop against*
# (Plan 019 B2). It must AGREE with the umbrella agent-suite/SUITE.lock
# ([components.regista] version + revision there); the umbrella is the generated
# authority and this face-local copy is vendored so cairn dev + CI resolve the
# spine WITHOUT cloning agent-suite. `scripts/dev-install.py` reads
# `[spine].version` and installs `regista-hraedon==<version>` from PyPI by
# default; `scripts/suite_lock.py` is the resolver. See docs/develop-against-lock.md.
#
# Regista is published to PyPI as `regista-hraedon` (import name stays `regista`).
# The pinned SHA/`describe` still records the exact commit for the local sibling
# workflow (`DEV_AGAINST=sibling`).
#
# (Shape note: this file was YAML `regista.ref` through Plan 008; Plan 019 B2
# converts it to the uniform TOML `[spine]` shape the resolver reads directly,
# and fixes the drift — the old YAML pinned regista `>=0.4.0` / SHA dd22197
# while CI installed 0.5.3.)

[component]
name = "agent-provenance"
version = "0.1.0"

[spine]
name = "regista"
# PyPI distribution (renamed from `regista`; import name is still `regista`).
distribution = "regista-hraedon"
repo = "hraedon/regista"
# The released PyPI version this cairn release develops + tests against.
# Must equal agent-suite/SUITE.lock [components.regista].version.
version = "0.7.1"
# The git SHA of regista this cairn release was tested against == the umbrella's
# [components.regista].revision (the v0.7.1 tag).
# Resolve the local sibling with: git -C ../regista checkout <sha>
sha = "8dd7b3464b0316f0f3a36e46dee64e36ceac6dbf"
describe = "v0.7.1"
# Mirrors the floor declared in pyproject.toml (the published lower bound); the
# exact version to develop against is `version` above, not this floor.
pyproject_floor = "regista-hraedon>=0.7.1,<0.8"

# Harness wiring (cairn install-harness):
#   claude   — ~/.claude/settings.json hooks + env
#   opencode — ~/.config/opencode/opencode.json plugin + env
#
# After install, a new agent session attests by default. CAIRN_DISABLE is the
# explicit, audit-visible escape hatch.
