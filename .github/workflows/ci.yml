name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          # regista is a public sibling repo, not on PyPI — install from git
          # before the editable install so cairn's regista>=0.5.1,<0.6 pin can
          # resolve. Matches the agent-notes/dossier CI pattern.
          pip install "regista @ git+https://github.com/hraedon/regista.git@main"
          pip install -e ".[dev]"

      # Denylist is never committed — it comes from the CAIRN_FORBIDDEN_IDENTIFIERS
      # repository secret (gpo-lens pattern). No-op until the secret is set.
      - name: Identifier gate
        env:
          CAIRN_FORBIDDEN_IDENTIFIERS: ${{ secrets.CAIRN_FORBIDDEN_IDENTIFIERS }}
        run: python3 scripts/check_committed_identifiers.py

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Verify test collection
        run: pytest --collect-only -q

      - name: Run tests
        run: pytest --tb=short -q

  js-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Run OpenCode plugin tests
        run: bun test
        working-directory: integrations/opencode
